[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nina-autopilot"
version = "0.1.0"
description = "Autonomous astrophotography orchestrator for N.I.N.A. — Phase 2 (safety supervisor + Conductor skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michele Bergo" }]

dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",  # FastAPI's TestClient
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
nina-autopilot = "nina_autopilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
